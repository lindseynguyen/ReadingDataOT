#config-version=FGR60F-7.2.8-FW-build1639-240313:opmode=0:vdom=0:user=admin
#conf_file_ver=000000000000000
#buildno=1639
config system global
    set hostname "SUBSTATION-FW1"
    set timezone 57
end
config system interface
    edit "wan1"
        set ip 198.51.100.10 255.255.255.248
        set allowaccess ping https ssh
        set role wan
    next
    edit "internal"
        set ip 10.50.0.1 255.255.255.0
        set allowaccess ping https http telnet
        set role lan
    next
end
config system admin
    edit "admin"
        set accprofile "super_admin"
    next
    edit "vendor"
        set trusthost1 10.50.0.0 255.255.255.0
        set accprofile "prof_admin"
    next
end
config system snmp community
    edit 1
        set name "public"
    next
end
config firewall policy
    edit 1
        set name "temp-commissioning"
        set srcintf "internal"
        set dstintf "wan1"
        set action accept
        set srcaddr "all"
        set dstaddr "all"
        set service "ALL"
        set logtraffic disable
    next
    edit 2
        set name "scada-to-rtu"
        set srcintf "internal"
        set dstintf "internal"
        set action accept
        set srcaddr "SCADA"
        set dstaddr "RTU-NET"
        set service "IEC-104"
    next
end
