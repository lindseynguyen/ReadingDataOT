name: Build Windows executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.* PyQt5 defusedxml pyyaml pytest

      - name: Run tests
        run: python -m pytest -q

      - name: Write Windows version resource
        shell: python
        run: |
          import re
          v = re.search(r'__version__ = "([^"]+)"', open("otinspect/__init__.py").read()).group(1)
          t = tuple(int(x) for x in (v.split(".") + ["0", "0", "0"])[:4])
          open("packaging/version_info.txt", "w").write(f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={t}, prodvers={t}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('040904B0', [
              StringStruct('CompanyName', 'OTInspect contributors'),
              StringStruct('FileDescription', 'OTInspect - OT/ICS file inventory'),
              StringStruct('FileVersion', '{v}'),
              StringStruct('ProductName', 'OTInspect'),
              StringStruct('ProductVersion', '{v}'),
              StringStruct('LegalCopyright', 'MIT License')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])])""")
          open("version.txt", "w").write(v)

      - name: Build
        run: pyinstaller packaging/otinspect.spec --noconfirm --clean

      - name: Smoke test executables
        run: python packaging/smoke_test.py dist

      - name: Package
        shell: pwsh
        run: |
          $v = Get-Content version.txt
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\OTInspect.exe, dist\otinspect-cli.exe, README.md, LICENSE pkg\
          Copy-Item docs pkg\docs -Recurse
          Copy-Item samples pkg\samples -Recurse
          Remove-Item pkg\samples\*.py
          Compress-Archive pkg\* "OTInspect-$v-windows-x64.zip"
          Get-FileHash "OTInspect-$v-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  OTInspect-$v-windows-x64.zip" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: OTInspect-windows-x64
          path: |
            OTInspect-*-windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OTInspect-*-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
