name: Build Windows executables

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write        # publish the GitHub release
  id-token: write        # sign build-provenance attestations (Sigstore)
  attestations: write    # store the attestations on GitHub

jobs:
  windows-exe:
    runs-on: windows-latest
    env:
      # Authenticode signing through SignPath (free for open source). Skipped until the
      # secret and variables exist: Settings -> Secrets and variables -> Actions.
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build dependencies
        run: python -m pip install pyinstaller==6.* PyQt5 defusedxml pyyaml pytest hypothesis

      - name: Run tests
        run: python -m pytest -q

      - name: Write Windows version resource
        shell: python
        run: |
          import re
          v = re.search(r'__version__ = "([^"]+)"', open("otinspect/__init__.py").read()).group(1)
          t = tuple(int(x) for x in (v.split(".") + ["0", "0", "0"])[:4])
          open("packaging/version_info.txt", "w").write(f"""VSVersionInfo(
            ffi=FixedFileInfo(filevers={t}, prodvers={t}, mask=0x3f, flags=0x0, OS=0x40004, fileType=0x1, subtype=0x0, date=(0, 0)),
            kids=[StringFileInfo([StringTable('040904B0', [
              StringStruct('CompanyName', 'OTInspect contributors'),
              StringStruct('FileDescription', 'OTInspect - OT/ICS file inventory'),
              StringStruct('FileVersion', '{v}'),
              StringStruct('ProductName', 'OTInspect'),
              StringStruct('ProductVersion', '{v}'),
              StringStruct('LegalCopyright', 'MIT License')])]),
              VarFileInfo([VarStruct('Translation', [1033, 1200])])])""")
          open("version.txt", "w").write(v)

      - name: Build
        run: pyinstaller packaging/otinspect.spec --noconfirm --clean

      - name: Smoke test executables
        run: python packaging/smoke_test.py dist

      # ---------------------------------------------------------------- code signing
      - name: Upload unsigned executables for signing
        id: unsigned
        if: env.SIGNPATH_API_TOKEN != ''
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-exe
          path: |
            dist/OTInspect.exe
            dist/otinspect-cli.exe
          if-no-files-found: error

      - name: Sign with SignPath (Authenticode)
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'ReadingDataOT' }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG || 'release-signing' }}
          artifact-configuration-slug: ${{ vars.SIGNPATH_ARTIFACT_CONFIGURATION_SLUG || 'initial' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600     # releases are approved manually
          output-artifact-directory: signed

      - name: Use signed executables and verify signatures
        if: env.SIGNPATH_API_TOKEN != ''
        shell: pwsh
        run: |
          Copy-Item signed\OTInspect.exe, signed\otinspect-cli.exe dist\ -Force
          foreach ($f in "dist\OTInspect.exe", "dist\otinspect-cli.exe") {
            $sig = Get-AuthenticodeSignature $f
            "{0}: {1} / {2} / timestamp {3}" -f $f, $sig.Status, $sig.SignerCertificate.Subject, $sig.TimeStamperCertificate.Subject
            if ($sig.Status -ne "Valid") { throw "$f is not validly signed: $($sig.StatusMessage)" }
            if (-not $sig.TimeStamperCertificate) { throw "$f has no timestamp" }
          }

      - name: Smoke test signed executables
        if: env.SIGNPATH_API_TOKEN != ''
        run: python packaging/smoke_test.py dist

      - name: Note unsigned build
        if: env.SIGNPATH_API_TOKEN == ''
        run: echo "::warning title=Unsigned build::SIGNPATH_API_TOKEN is not set; executables are not Authenticode-signed (build provenance is still attested)."

      - name: Package
        shell: pwsh
        run: |
          $v = Get-Content version.txt
          New-Item -ItemType Directory pkg | Out-Null
          Copy-Item dist\OTInspect.exe, dist\otinspect-cli.exe, README.md, LICENSE pkg\
          Copy-Item docs pkg\docs -Recurse
          Copy-Item samples pkg\samples -Recurse
          Remove-Item pkg\samples\*.py
          Compress-Archive pkg\* "OTInspect-$v-windows-x64.zip"
          Get-FileHash "OTInspect-$v-windows-x64.zip" -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  OTInspect-$v-windows-x64.zip" } | Out-File -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      # ---------------------------------------------------------------- provenance
      - name: Attest build provenance (zip and executables)
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            OTInspect-*-windows-x64.zip
            dist/OTInspect.exe
            dist/otinspect-cli.exe

      - uses: actions/upload-artifact@v4
        with:
          name: OTInspect-windows-x64
          path: |
            OTInspect-*-windows-x64.zip
            SHA256SUMS.txt

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            OTInspect-*-windows-x64.zip
            SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ### Verify your download

            1. Checksum: compare `Get-FileHash OTInspect-*-windows-x64.zip` with `SHA256SUMS.txt`.
            2. Provenance: `gh attestation verify OTInspect-<version>-windows-x64.zip --repo ${{ github.repository }}`
               proves the zip (and each `.exe` inside it) was built by this repository's release workflow from tag `${{ github.ref_name }}`.
            3. Signature (when signed): right-click the `.exe` → Properties → Digital Signatures, or `Get-AuthenticodeSignature .\OTInspect.exe`.

            See [docs/code-signing-policy.md](https://github.com/${{ github.repository }}/blob/main/docs/code-signing-policy.md).
