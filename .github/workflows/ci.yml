name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Lint
        run: python -m pyflakes otinspect/core otinspect/parsers otinspect/report otinspect/gui otinspect/cli.py otinspect/diff/scd_diff.py otinspect/rules/engine.py otinspect/rules/advisories.py
      - name: Tests
        run: python -m pytest -q
      - name: CLI smoke test
        run: |
          otinspect scan samples -q --html report.html --json report.json
          otinspect diff samples/substation_demo.scd samples/substation_demo_v2.scd
